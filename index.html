    <script>
      // Vite HMR is disabled in AI Studio iFrame environment; handle 'vite-hmr' safely
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof protocols === 'string' && protocols.indexOf('vite') !== -1)) {
              var dummy = new EventTarget();
              dummy.readyState = 1;
              dummy.send = function() {};
              dummy.close = function() {};
              setTimeout(function() {
                dummy.dispatchEvent(new Event('open'));
              }, 0);
              return dummy;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }
        window.addEventListener('unhandledrejection', function(event) {
          var msg = String((event && event.reason && event.reason.message) || (event && event.reason) || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = String((event && event.message) || '');
          var file = String((event && event.filename) || '');
          if (file.indexOf('@vite/client') !== -1 || msg.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
