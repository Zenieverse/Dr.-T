name: ChatQuest Live CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'chatquest-live/**'
      - 'src/App.tsx'
      - 'src/types.ts'
      - 'src/components/layout/Navbar.tsx'
      - 'server.impl.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/chatquest-live.yml'
  workflow_dispatch:
  push:
    branches: [main, feat/chatquest-live-twitchcon-2026]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type check Dr. T frontend
        run: bun run lint
      - name: ChatQuest domain and mocked Twitch integration tests
        run: bun run test:chatquest
      - name: Production build
        run: bun run build
