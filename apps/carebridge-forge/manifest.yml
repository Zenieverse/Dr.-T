modules:
  jira:issuePanel:
    - key: carebridge-jira-issue-panel
      resource: carebridge-ui
      resolver:
        function: carebridge-resolver
      viewportSize: medium
      title: CareBridge — Follow-Up Continuity
      icon: resource:carebridge-icons;carebridge.svg

  jira:globalPage:
    - key: carebridge-jsm-hub
      resource: carebridge-ui
      resolver:
        function: carebridge-resolver
      title: Dr. T — CareBridge Navigator
      route: carebridge
      icon: resource:carebridge-icons;carebridge.svg

  jiraServiceManagement:portalRequestDetailPanel:
    - key: carebridge-jsm-portal-panel
      resource: carebridge-ui
      resolver:
        function: carebridge-resolver
      viewportSize: medium
      title: CareBridge — Portal Follow-Up Status
      unlicensedAccess:
        - customer
        - unlicensed

  confluence:globalPage:
    - key: carebridge-confluence-hub
      resource: carebridge-ui
      resolver:
        function: carebridge-resolver
      title: Dr. T — CareBridge Knowledge Hub
      route: carebridge
      icon: resource:carebridge-icons;carebridge.svg

  confluence:contentAction:
    - key: carebridge-confluence-knowledge-link
      resource: carebridge-ui
      resolver:
        function: carebridge-resolver
      viewportSize: medium
      title: Link Care Guidance to CareBridge
      icon: resource:carebridge-icons;carebridge.svg

  rovo:agent:
    - key: carebridge-navigator
      name: CareBridge Care Navigator
      description: >-
        Non-diagnostic healthcare care-navigation assistant helping authorized users review
        Jira Service Management follow-up requests, Confluence clinical guidance, and care continuity tasks.
      prompt: >-
        You are CareBridge Care Navigator for Dr. T — CareBridge.
        Your sole scope is non-emergency care navigation, administrative follow-up coordination,
        and retrieving authorized Jira Service Management and Confluence records.

        Mandatory clinical safety, provenance, and privacy guardrails:
        1. You are NOT a clinician and must NEVER offer medical diagnoses, triage levels,
           prescriptions, or treatment recommendations.
        2. Label every AI synthesis or suggestion clearly as unverified until reviewed by an authorized human.
        3. Strictly separate verified Atlassian source records (JSM request keys, Confluence page IDs/titles)
           from user-recorded administrative tasks and AI-generated suggestions.
        4. If requested information is missing or inaccessible, explicitly state what is missing.
           Never invent clinical guidelines, citations, request keys, or dates.
        5. Enforce strict data minimization: never request or repeat SSN, MRN, DOB, or raw diagnostic charts
           unless already authorized in scope and needed for navigation.
        6. Never create JSM follow-up requests automatically; require explicit human review and confirmation in UI.
      conversationStarters:
        - Summarize my authorized care-navigation context and open follow-up tasks
        - Search Confluence knowledge pages for post-visit follow-up instructions
        - Summarize follow-up task deadlines and JSM request status
        - Prepare a care-navigation handoff showing missing information
      actions:
        - summarize-care-context
        - retrieve-care-knowledge
        - summarize-followup-tasks
        - prepare-care-handoff

  action:
    - key: summarize-care-context
      name: Summarize Authorized Care Context
      function: rovo-care-context
      actionVerb: GET
      description: >-
        Compiles authorized JSM follow-up request statuses, linked Confluence pages, and
        saved CareBridge administrative tasks while keeping verified sources separate from AI output.
      inputs:
        contextRef:
          title: Care Navigation Context Reference
          type: string
          required: false
          description: User-owned care navigation context label (for example, Post-Visit Scheduling).
        issueKey:
          title: JSM Request Key
          type: string
          required: false
          description: Optional Jira Service Management request key currently open.

    - key: retrieve-care-knowledge
      name: Retrieve Confluence Care Knowledge
      function: rovo-care-knowledge
      actionVerb: GET
      description: >-
        Searches user-authorized Confluence spaces and pages using Forge asUser() permissions
        and returns grounded source excerpts and URLs without fabricating clinical advice.
      inputs:
        query:
          title: Care Navigation Search Topic
          type: string
          required: true
          description: Administrative or care-coordination topic to search in authorized Confluence spaces.

    - key: summarize-followup-tasks
      name: Summarize Follow-Up Tasks
      function: rovo-followup-tasks
      actionVerb: GET
      description: >-
        Summarizes open non-emergency CareBridge follow-up tasks, priorities, assignees,
        and due dates from user-scoped Forge storage and highlights missing fields.
      inputs:
        statusFilter:
          title: Status Filter
          type: string
          required: false
          description: Optional task status filter (open, scheduled, waiting_external, completed, deferred).

    - key: prepare-care-handoff
      name: Prepare Care Navigation Handoff
      function: rovo-care-handoff
      actionVerb: GET
      description: >-
        Prepares a structured 4-bucket Care Re-entry Brief separating Verified Source Information,
        User-Recorded Information, Unconfirmed AI Suggestion, and Missing or Unavailable Context.
      inputs:
        contextRef:
          title: Context Reference
          type: string
          required: false
          description: Optional navigation track label to summarize.
        issueKey:
          title: JSM Request Key
          type: string
          required: false
          description: Optional active JSM request key for reference.

  function:
    - key: carebridge-resolver
      handler: index.handler
    - key: rovo-care-context
      handler: rovoActions.summarizeCareContext
    - key: rovo-care-knowledge
      handler: rovoActions.retrieveCareKnowledge
    - key: rovo-followup-tasks
      handler: rovoActions.summarizeFollowupTasks
    - key: rovo-care-handoff
      handler: rovoActions.prepareCareHandoff

resources:
  - key: carebridge-ui
    path: static/carebridge-ui
  - key: carebridge-icons
    path: static/icons

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/REPLACE_WITH_CAREBRIDGE_FORGE_REGISTER_APP_ID

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:servicedesk-request
    - write:servicedesk-request
    - read:page:confluence
    - read:confluence-content.summary
    - read:confluence-space.summary
    - storage:app
