modules:
  jira:issuePanel:
    - key: hatbridge-jira-issue-panel
      resource: hatbridge-ui
      resolver:
        function: hatbridge-resolver
      viewportSize: medium
      title: HatBridge — Role & Re-entry Context
      icon: resource:hatbridge-icons;hatbridge.svg

  jira:globalPage:
    - key: hatbridge-jira-hub
      resource: hatbridge-ui
      resolver:
        function: hatbridge-resolver
      title: Dr. T HatBridge Mission Control
      route: hatbridge
      icon: resource:hatbridge-icons;hatbridge.svg

  confluence:globalPage:
    - key: hatbridge-confluence-hub
      resource: hatbridge-ui
      resolver:
        function: hatbridge-resolver
      title: Dr. T HatBridge Mission Control
      route: hatbridge
      icon: resource:hatbridge-icons;hatbridge.svg

  confluence:contentAction:
    - key: hatbridge-confluence-decision-link
      resource: hatbridge-ui
      resolver:
        function: hatbridge-resolver
      viewportSize: medium
      title: Link Page to HatBridge Decision
      icon: resource:hatbridge-icons;hatbridge.svg

  rovo:agent:
    - key: hatbridge-context-navigator
      name: HatBridge Context Navigator
      description: >-
        Helps professionals wearing multiple hats re-enter Jira projects and Confluence
        workspaces without losing important decisions, open questions, or next actions.
      prompt: >-
        You are HatBridge Context Navigator for Dr. T — HatBridge.
        Your mission is to help a user re-enter a work context cleanly and answer grounded
        questions about authorized Jira issues, Confluence pages, role handoffs, and decisions.

        Non-negotiable grounding and privacy rules:
        1. Strictly separate observed facts from your suggestions, and cite exact Jira keys,
           Confluence page IDs/titles, or saved handoff timestamps.
        2. If a requested detail is not present in the retrieved authorized data, respond with:
           "Not available in the connected context." Never invent facts, owners, dates, or links.
        3. Respect source Atlassian permissions: rely strictly on the user-scoped action results.
        4. Never include private personal or family health notes in workplace summaries or Jira/Confluence suggestions.
        5. Never create or modify Jira issues automatically; propose draft details and require explicit user confirmation in the UI.
      conversationStarters:
        - Prepare my re-entry brief for my active hat
        - Search authorized decisions in this workspace
        - Draft a handoff summary before I switch hats
        - What is my next meaningful action here?
      actions:
        - get-reentry-brief
        - search-authorized-decisions
        - prepare-role-handoff
        - suggest-next-action

  action:
    - key: get-reentry-brief
      name: Get Re-entry Brief
      function: rovo-get-reentry-brief
      actionVerb: GET
      description: >-
        Retrieves the grounded role re-entry brief combining authorized Jira/Confluence items
        linked to the specified hat and saved user handoff notes in Forge KVS.
      inputs:
        roleName:
          title: Role or Hat Name
          type: string
          required: false
          description: The professional hat name to resume (for example, University Dean or Principal Architect).
        issueKey:
          title: Jira Issue Key
          type: string
          required: false
          description: Optional Jira issue key currently open in context.

    - key: search-authorized-decisions
      name: Search Authorized Decisions
      function: rovo-search-decisions
      actionVerb: GET
      description: >-
        Searches user-authorized Confluence pages, Jira issues, and saved HatBridge workplace decisions
        matching the query without accessing private personal notes.
      inputs:
        query:
          title: Search Query
          type: string
          required: true
          description: Keyword or topic to search across authorized decisions and pages.

    - key: prepare-role-handoff
      name: Prepare Role Handoff
      function: rovo-prepare-handoff
      actionVerb: GET
      description: >-
        Compiles a read-only handoff draft summarizing open linked Jira work and saved context
        before the user switches to another hat.
      inputs:
        roleName:
          title: Role Name
          type: string
          required: true
          description: The role the user is pausing or leaving.
        issueKey:
          title: Active Jira Issue Key
          type: string
          required: false
          description: Optional active Jira issue key to cite in the handoff draft.

    - key: suggest-next-action
      name: Suggest Next Action
      function: rovo-suggest-next-action
      actionVerb: GET
      description: >-
        Proposes one grounded next meaningful action based strictly on open Jira issues,
        waiting dependencies, and saved handoffs for the selected hat.
      inputs:
        roleName:
          title: Role Name
          type: string
          required: false
          description: Target hat name for suggesting the next action.

  function:
    - key: hatbridge-resolver
      handler: index.handler
    - key: rovo-get-reentry-brief
      handler: rovoActions.getReentryBrief
    - key: rovo-search-decisions
      handler: rovoActions.searchAuthorizedDecisions
    - key: rovo-prepare-handoff
      handler: rovoActions.prepareRoleHandoff
    - key: rovo-suggest-next-action
      handler: rovoActions.suggestNextAction

resources:
  - key: hatbridge-ui
    path: static/hatbridge-ui
  - key: hatbridge-icons
    path: static/icons

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/REPLACE_WITH_FORGE_REGISTER_APP_ID

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:page:confluence
    - read:confluence-content.summary
    - read:confluence-space.summary
    - storage:app
